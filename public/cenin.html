h1,h2,h3{font-family:'Permanent Marker',cursive;font-weight:400;margin:0;line-height:1.05}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
#app{max-width:860px;margin:0 auto;padding:28px 20px}
#app.in{animation:troca .38s cubic-bezier(.2,.8,.2,1)}
@keyframes troca{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.hero{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero img{width:min(56vw,220px);border-radius:50%;border:4px solid var(--ink);box-shadow:0 0 0 6px #000,0 0 60px #e5262d88}
.hero h1{font-size:clamp(52px,15vw,110px);margin-top:26px;color:var(--lime);transform:rotate(-3deg);text-shadow:4px 4px 0 #000,-2px -2px 0 #000}
.hero p{max-width:30ch;font-size:20px;margin:14px 0 26px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;cursor:pointer;background:var(--red);color:#fff;font:700 20px 'Barlow Condensed',sans-serif;padding:13px 26px;border:3px solid #000;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.alt{background:var(--lime);color:#000}
.btn.sm{font-size:16px;padding:7px 14px;box-shadow:3px 3px 0 var(--ink)}
h2{font-size:clamp(34px,8vw,52px);margin-bottom:22px;transform:rotate(-1.5deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#0d0d0dd0;border:2px solid var(--ink);padding:18px;box-shadow:6px 6px 0 var(--lime)}
.card h3{font-size:26px;color:var(--lime);margin-bottom:6px}
.card p{margin:0;color:var(--mut)}
.box{background:#0d0d0dd9;border:2px solid var(--ink);padding:20px;box-shadow:6px 6px 0 var(--red)}
label{display:block;font:700 18px 'Barlow Condensed',sans-serif;margin:14px 0 4px}
input,select,textarea{width:100%;background:#000;border:2px solid var(--line);padding:11px;border-radius:0}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chip{cursor:pointer;background:#000;border:2px solid var(--ink);padding:8px 16px;font:700 18px 'Barlow Condensed',sans-serif}
.chip[aria-pressed=true]{background:var(--lime);color:#000;border-color:#000}
.hint{color:var(--mut);font-size:15px;margin:6px 0 0}
.err{color:#ff7b80;font-weight:500;margin:10px 0 0;min-height:1.4em}
.care{padding:0;margin:0;list-style:none}
.care li{margin-bottom:10px;padding-left:24px;position:relative}
.care li::before{content:"✕";position:absolute;left:0;color:var(--red);font-weight:700}
.est{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}
@media(max-width:560px){.est{grid-template-columns:1fr auto}.est input:nth-child(2){grid-column:1/-1;order:3}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;background:#000;border-top:3px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;background:none;border:0;cursor:pointer;padding:6px 2px;font:700 16px 'Barlow Condensed',sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:22px;line-height:1}
#tabs button[aria-current=page]{color:var(--lime)}
@media(prefers-reduced-motion:reduce){#app.in{animation:none}.btn{transition:none}}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 30px}.gallery img,.gallery-admin img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.gallery-admin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.gallery-admin>div{min-width:0}.gallery-admin button{width:100%;margin-top:5px}.hint{color:var(--mut);font-size:.9rem}@media(min-width:650px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gallery img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);padding:56px 58px 72px;touch-action:pan-y}
.lightbox.open{display:flex}
.lightbox-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px #0008}
.lightbox button{position:absolute;border:0;color:#fff;background:#222c;border-radius:50%;width:44px;height:44px;font-size:30px;line-height:1;cursor:pointer}
.lightbox-close{top:16px;right:16px}
.lightbox-arrow{top:50%;transform:translateY(-50%)}
.lightbox-prev{left:12px}.lightbox-next{right:12px}
.lightbox-count{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
body.lightbox-open{overflow:hidden}
@media(max-width:520px){.lightbox{padding:54px 42px 68px}.lightbox button{width:40px;height:40px}.lightbox-prev{left:5px}.lightbox-next{right:5px}}
</style></head><body>
